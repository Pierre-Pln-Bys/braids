#
# Flatpak of braids, made from the release tarball (utils/dist/package-linux)
# on the GNOME runtime, which has WebKitGTK and GStreamer. Built in the release
# workflow; by hand, from the repository root:
#
#   utils/dist/package-linux
#   git clone --depth 1 https://github.com/flathub/shared-modules utils/dist/flatpak/shared-modules
#   flatpak-builder --user --install --force-clean build-flatpak utils/dist/flatpak/org.braids.app.yml
#
# The data lives in ~/.var/app/org.braids.app (not ~/.config/braids).

app-id: org.braids.app
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: braids
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # voice messages: record and play
  - --socket=pulseaudio
  # tray icon and notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # saving attachments ("Download file")
  - --filesystem=xdg-download

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  # libmagic (file types of attachments), not in the runtime
  - name: libmagic
    buildsystem: simple
    build-commands:
      - autoreconf -fi
      - ./configure --prefix=/app --disable-static --enable-shared --disable-bzlib --disable-xzlib --disable-zstdlib --disable-lzlib
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    cleanup:
      - /bin
      - /include
      - /share/man
      - '*.la'
    sources:
      - type: git
        url: https://github.com/file/file.git
        tag: FILE5_46

  - name: braids
    buildsystem: simple
    build-commands:
      - cp -a tree/bin tree/lib /app/
      - mkdir -p /app/share
      - cp -a tree/share/. /app/share/
      - rm -f /app/share/braids-install.sh /app/share/applications/braids.desktop
      - rm -f /app/share/icons/hicolor/128x128/apps/braids.png /app/share/icons/hicolor/256x256/apps/braids.png
      - install -Dm644 tree/share/icons/hicolor/128x128/apps/braids.png /app/share/icons/hicolor/128x128/apps/org.braids.app.png
      - install -Dm644 tree/share/icons/hicolor/256x256/apps/braids.png /app/share/icons/hicolor/256x256/apps/org.braids.app.png
      - install -Dm644 tree/share/icons/hicolor/scalable/apps/braids.svg /app/share/icons/hicolor/scalable/apps/org.braids.app.svg
      - rm -f /app/share/icons/hicolor/scalable/apps/braids.svg
      - install -Dm644 org.braids.app.desktop /app/share/applications/org.braids.app.desktop
      - install -Dm644 org.braids.app.metainfo.xml /app/share/metainfo/org.braids.app.metainfo.xml
    sources:
      - type: archive
        path: ../../../dist/braids-linux-x86_64.tar.gz
        dest: tree
        only-arches: [x86_64]
      - type: archive
        path: ../../../dist/braids-linux-aarch64.tar.gz
        dest: tree
        only-arches: [aarch64]
      - type: file
        path: org.braids.app.desktop
      - type: file
        path: org.braids.app.metainfo.xml
